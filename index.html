<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Router</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">PROMPT ROUTER</div>
          <h1>把好提示词，变成随手工具</h1>
        </div>
        <button id="settings-button" class="icon-button" title="设置">⚙</button>
      </header>

      <nav class="mode-switch" aria-label="工作模式">
        <button class="mode-button active" data-mode="search">搜索提示词</button>
        <button class="mode-button" data-mode="route">自动匹配</button>
      </nav>

      <section class="hero-input">
        <label id="input-label" for="main-input">搜索名称、分类、关键词</label>
        <textarea id="main-input" rows="2" autofocus placeholder="例如：我在两个显示器之间不知道怎么选"></textarea>
        <div class="input-footer">
          <span id="prompt-count">正在加载提示词…</span>
          <button id="route-shortcut" class="shortcut-button">不知道用哪个？自动帮我选</button>
          <button id="run-button" class="primary-button">开始匹配</button>
        </div>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="results" class="results"></section>
      <section id="editor" class="editor hidden"></section>

      <footer class="footer-hint">
        <span>⌘/Ctrl + Shift + Space</span>
        <span>全局唤起</span>
      </footer>
    </main>
    <script type="module" src="dist/renderer.js"></script>
  </body>
</html>
